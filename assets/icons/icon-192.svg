<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="iconBg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FBF3E2" />
    </linearGradient>
    <linearGradient id="pinLeft192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93181F"/>
      <stop offset="100%" stop-color="#7C0E15"/>
    </linearGradient>
    <linearGradient id="pinRight192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F0A11"/>
      <stop offset="100%" stop-color="#55050A"/>
    </linearGradient>
    <filter id="dropShadow192" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#840f16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="44" fill="url(#iconBg192)" stroke="#EADFD1" stroke-width="2"/>

  <!-- Center Pin Logo -->
  <g transform="translate(48, 22) scale(0.48)" filter="url(#dropShadow192)">
    <!-- LEFT HALF OF PIN -->
    <path d="M 100 12 C 58 12 24 46 24 88 C 24 128 62 170 100 216 L 100 12 Z" fill="url(#pinLeft192)" />

    <!-- RIGHT HALF OF PIN -->
    <path d="M 100 12 L 100 216 C 138 170 176 128 176 88 C 176 46 142 12 100 12 Z" fill="url(#pinRight192)" />

    <!-- SPOON CUTOUT -->
    <path d="
      M 93 208
      C 94 185 88 150 78 126
      C 67 99 68 56 100 56
      C 132 56 133 99 122 126
      C 112 150 106 185 107 208
      Z"
      fill="#FFFDF9"
    />

    <!-- CENTER RED DOT -->
    <circle cx="100" cy="94" r="14" fill="#7C0E15" />
    <circle cx="98" cy="92" r="13" fill="#93181F" />
  </g>

  <!-- Subtitle -->
  <text x="96" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900" fill="#1B2028" letter-spacing="-0.03em">
    Yoyaku
  </text>
</svg>
