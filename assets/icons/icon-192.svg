<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="yoyakuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#840f16" />
      <stop offset="50%" stop-color="#60090e" />
      <stop offset="100%" stop-color="#231916" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E2" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="192" height="192" rx="42" fill="url(#yoyakuBg)" />
  
  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="rgba(251, 243, 226, 0.2)" stroke-width="2" />
  
  <!-- Center Dining / Reservation Icon -->
  <g filter="url(#dropShadow)">
    <!-- Plate Ring -->
    <circle cx="96" cy="96" r="44" fill="none" stroke="url(#goldAcc)" stroke-width="4" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="96" cy="96" r="36" fill="#840f16" stroke="url(#goldAcc)" stroke-width="3"/>
    
    <!-- Stylized Utensils / Cloche Symbol -->
    <!-- Fork -->
    <path d="M78 72 v20 c0 4 3 7 7 7 v27 h4 v-27 c4 0 7-3 7-7 v-20 h-3 v14 h-3 v-14 h-2 v14 h-3 v-14 z" fill="#FFF7E8"/>
    <!-- Knife -->
    <path d="M114 72 c-5 0 -8 4 -8 10 v17 c0 4 3 7 7 7 v20 h4 v-48 c0 -4 -1 -6 -3 -6 z" fill="#FFF7E8"/>
    <!-- Center Sparkle / Star -->
    <circle cx="96" cy="96" r="3.5" fill="#D4AF37"/>
  </g>
</svg>
