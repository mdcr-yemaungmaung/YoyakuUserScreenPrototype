<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FBF3E2" />
    </linearGradient>
    <linearGradient id="pinLeftMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93181F"/>
      <stop offset="100%" stop-color="#7C0E15"/>
    </linearGradient>
    <linearGradient id="pinRightMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F0A11"/>
      <stop offset="100%" stop-color="#55050A"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#maskBg)" />

  <!-- Center Pin Logo in Safe Area -->
  <g transform="translate(156, 80) scale(1.0)">
    <!-- LEFT HALF OF PIN -->
    <path d="M 100 12 C 58 12 24 46 24 88 C 24 128 62 170 100 216 L 100 12 Z" fill="url(#pinLeftMask)" />

    <!-- RIGHT HALF OF PIN -->
    <path d="M 100 12 L 100 216 C 138 170 176 128 176 88 C 176 46 142 12 100 12 Z" fill="url(#pinRightMask)" />

    <!-- SPOON CUTOUT -->
    <path d="
      M 93 208
      C 94 185 88 150 78 126
      C 67 99 68 56 100 56
      C 132 56 133 99 122 126
      C 112 150 106 185 107 208
      Z"
      fill="#FFFDF9"
    />

    <!-- CENTER RED DOT -->
    <circle cx="100" cy="94" r="14" fill="#7C0E15" />
    <circle cx="98" cy="92" r="13" fill="#93181F" />
  </g>

  <!-- Wordmark in Safe Area -->
  <text x="256" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" fill="#1B2028" letter-spacing="-0.03em">
    Yoyaku
  </text>
</svg>
