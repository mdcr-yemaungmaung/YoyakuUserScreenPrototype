<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <defs>
    <!-- Left Half Gradient (Rich Crimson) -->
    <linearGradient id="pinLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93181F"/>
      <stop offset="100%" stop-color="#7C0E15"/>
    </linearGradient>
    <!-- Right Half Gradient (Deep Burgundy Shadow) -->
    <linearGradient id="pinRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F0A11"/>
      <stop offset="100%" stop-color="#55050A"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Group with subtle drop shadow -->
  <g filter="url(#logoShadow)">
    <!-- LEFT HALF OF PIN -->
    <path d="M 100 12 C 58 12 24 46 24 88 C 24 128 62 170 100 216 L 100 12 Z" fill="url(#pinLeft)" />

    <!-- RIGHT HALF OF PIN -->
    <path d="M 100 12 L 100 216 C 138 170 176 128 176 88 C 176 46 142 12 100 12 Z" fill="url(#pinRight)" />

    <!-- SPOON CUTOUT (Clean Off-White) -->
    <path d="
      M 93 208
      C 94 185 88 150 78 126
      C 67 99 68 56 100 56
      C 132 56 133 99 122 126
      C 112 150 106 185 107 208
      Z"
      fill="#FFF7E8"
    />

    <!-- SPOON HANDLE INNER CURVE HIGHLIGHT -->
    <path d="
      M 95 208
      L 95 140
      C 95 130 90 120 86 110
      C 77 88 78 60 100 60
      C 122 60 123 88 114 110
      C 110 120 105 130 105 140
      L 105 208
      Z"
      fill="#FFFDF9"
    />

    <!-- CENTER PIN-POINT DOT INSIDE SPOON BOWL -->
    <circle cx="100" cy="94" r="14" fill="#7C0E15" />
    <circle cx="98" cy="92" r="13" fill="#93181F" />
  </g>
</svg>
